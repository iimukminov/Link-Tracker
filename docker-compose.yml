services:
  postgresql:
    image: postgres:16-alpine
    container_name: link_tracker_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "54321:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  liquibase-migrations:
    container_name: migrations
    image: liquibase/liquibase:4.29
    depends_on:
      postgresql:
        condition: service_healthy
    command:
      - --searchPath=/changesets
      - --changelog-file=master.xml
      - --driver=org.postgresql.Driver
      - --url=${SPRING_DATASOURCE_URL}
      - --username=${SPRING_DATASOURCE_USERNAME}
      - --password=${SPRING_DATASOURCE_PASSWORD}
      - update
    volumes:
      - ./migrations:/changesets
    networks:
      - backend

  bot:
    build:
      dockerfile: bot/Dockerfile
    container_name: link_tracker_bot
    ports:
      - "${BOT_PORT}:${BOT_PORT}"
    volumes:
      - ./bot/config/messages.yml:/app/config/messages.yml
    env_file:
      - .env
    networks:
      - backend
    depends_on:
      valkey-cluster-init:
        condition: service_completed_successfully
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      scrapper:
        condition: service_started
      schema-registry:
        condition: service_healthy

  scrapper:
    build:
      dockerfile: scrapper/Dockerfile
    container_name: link_tracker_scrapper
    ports:
      - "8081:8081"
    volumes:
      - ./scrapper/config/messages.yml:/app/config/messages.yml
    env_file:
      - .env
    networks:
      - backend
    depends_on:
      valkey-cluster-init:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      liquibase-migrations:
        condition: service_completed_successfully
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  kafka-1:
    image: confluentinc/cp-kafka:7.8.0
    container_name: link-tracker-kafka-1
    ports:
      - "${KAFKA_1_PORT}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:${KAFKA_1_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-2:
    image: confluentinc/cp-kafka:7.8.0
    container_name: link-tracker-kafka-2
    ports:
      - "${KAFKA_2_PORT}:29093"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:${KAFKA_2_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-3:
    image: confluentinc/cp-kafka:7.8.0
    container_name: link-tracker-kafka-3
    ports:
      - "${KAFKA_3_PORT}:29094"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:${KAFKA_3_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: link-tracker-kafka-ui
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=link-tracker-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    networks:
      - backend

  valkey-node-1:
    image: valkey/valkey:8.0-alpine
    container_name: ${VALKEY_HOST_1}
    command: ["valkey-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--requirepass", "${VALKEY_PASSWORD}", "--masterauth", "${VALKEY_PASSWORD}", "--notify-keyspace-events", "AKE", "--cluster-announce-ip", "${VALKEY_HOST_1}"]
    ports:
      - "${VALKEY_PORT_1}:6379"
    volumes:
      - valkey-1-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey-node-2:
    image: valkey/valkey:8.0-alpine
    container_name: ${VALKEY_HOST_2}
    command: ["valkey-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--requirepass", "${VALKEY_PASSWORD}", "--masterauth", "${VALKEY_PASSWORD}", "--notify-keyspace-events", "AKE", "--cluster-announce-ip", "${VALKEY_HOST_2}"]
    ports:
      - "${VALKEY_PORT_2}:6379"
    volumes:
      - valkey-2-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey-node-3:
    image: valkey/valkey:8.0-alpine
    container_name: ${VALKEY_HOST_3}
    command: ["valkey-server", "--cluster-enabled", "yes", "--cluster-config-file", "nodes.conf", "--cluster-node-timeout", "5000", "--appendonly", "yes", "--requirepass", "${VALKEY_PASSWORD}", "--masterauth", "${VALKEY_PASSWORD}", "--notify-keyspace-events", "AKE", "--cluster-announce-ip", "${VALKEY_HOST_3}"]
    ports:
      - "${VALKEY_PORT_3}:6379"
    volumes:
      - valkey-3-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  valkey-cluster-init:
    image: valkey/valkey:8.0-alpine
    depends_on:
      valkey-node-1:
        condition: service_healthy
      valkey-node-2:
        condition: service_healthy
      valkey-node-3:
        condition: service_healthy
    networks:
      - backend
    command: >
      sh -c "valkey-cli --cluster create ${VALKEY_NODES_LIST} --cluster-replicas 0 -a ${VALKEY_PASSWORD} --cluster-yes || echo 'Cluster already exists!'"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    container_name: link-tracker-schema-registry
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    ports:
      - "8085:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: link-tracker-kafka-1:9092,link-tracker-kafka-2:9092,link-tracker-kafka-3:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    networks:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "curl --silent --fail http://localhost:8081/subjects || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-agent:
    build:
      context: .
      dockerfile: ai-agent/Dockerfile
    container_name: link-tracker-ai-agent
    ports:
      - "8083:8083"
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_SCHEMA_REGISTRY_URL=${KAFKA_SCHEMA_REGISTRY_URL}
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - backend

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/alerts:/etc/grafana/provisioning/alerting:ro
      - ./monitoring/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - backend

  pushgateway:
    image: prom/pushgateway:v1.8.0
    container_name: pushgateway
    restart: unless-stopped
    ports:
      - "${PUSHGATEWAY_PORT:-9091}:9091"
    networks:
      - backend

volumes:
  pg_data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  valkey-1-data:
  valkey-2-data:
  valkey-3-data:
  prometheus-data:
  grafana-data:

networks:
  backend:
