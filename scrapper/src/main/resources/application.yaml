server:
  port: 8081

spring:
  application:
    name: scrapper
  config:
    import:
      - optional:file:scrapper/config/messages.yml
      - optional:file:config/messages.yml

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: false
    change-log: classpath:migrations/master.xml

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    properties:
      schema.registry.url: ${KAFKA_SCHEMA_REGISTRY_URL}
    producer:
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
    consumer:
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        specific.avro.reader: true

  data:
    redis:
      password: ${VALKEY_PASSWORD}
      cluster:
        nodes: ${SCRAPPER_VALKEY_CLUSTER_NODES}
      lettuce:
        cluster:
          refresh:
            adaptive: true
            period: 60s

app:
  bot:
    base-url: ${BOT_URL:http://localhost:8080}
    timeout: 10s

  scheduler:
    enable: true
    interval: 10s
    force-check-delay: 10m
    batch-size: 200
    threads-count: 4

  links:
    limit: 100

  cache:
    l1-ttl: ${VALKEY_L1_TTL:1m}
    l2-ttl: ${VALKEY_L2_TTL:10m}
    client-side:
      enabled: ${SCRAPPER_VALKEY_CLIENT_SIDE_CACHE_ENABLED:true}
      max-size: 10000

  stackoverflow:
    base-url: https://api.stackexchange.com/2.2
    key: ${STACKOVERFLOW_KEY}
    access-token: ${STACKOVERFLOW_ACCESS_KEY}
    timeout: 10s

  github:
    base-url: https://api.github.com
    token: ${GITHUB_TOKEN}
    timeout: 10s

  database:
    #SQL или ORM
    access-type: ORM

  use-queue: false
  kafka:
    topic: ${KAFKA_TOPIC_RAW_UPDATES:link.raw-updates}
    partitions: ${KAFKA_TOPIC_PARTITIONS:1}
    replicas: ${KAFKA_TOPIC_REPLICAS:1}

  use-outbox: true
  outbox:
    interval: 5000
    batch-size: 100

  rate-limit:
    capacity: 20
    duration: 1m
    cache-max-size: 50000
    cache-expire-after-access: 30m

resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 2s
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.net.SocketTimeoutException
          - java.io.IOException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

      exponential-bonus:
        max-attempts: 4
        wait-duration: 1s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.net.SocketTimeoutException
          - java.io.IOException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

    instances:
      github:
        base-config: exponential-bonus
      stackoverflow:
        base-config: default
      bot:
        base-config: default

  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.net.SocketTimeoutException
          - java.io.IOException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
    instances:
      github:
        base-config: default
      stackoverflow:
        base-config: default
      bot:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      app_type: scrapper
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        pushgateway:
          enabled: ${PUSHGATEWAY_ENABLED:false}
          address: ${PUSHGATEWAY_ADDRESS:localhost:9091}
          job: ${spring.application.name}
          push-rate: 30s
          grouping-key:
            application: ${spring.application.name}
            app_type: scrapper

