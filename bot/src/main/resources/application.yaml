server:
  port: 8080

spring:
  application:
    name: bot
  config:
    import:
      - optional:file:bot/config/messages.yml
      - optional:file:config/messages.yml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: link-tracker-bot
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
app:
  scrapper:
    base-url: ${SCRAPPER_URL:http://localhost:8081}
  telegram:
    url: https://api.telegram.org/bot
    token: ${TELEGRAM_BOT_TOKEN} # Use env variable. DO NOT KEEP TOKEN HERE
    update-listener-sleep: 1s
    debug: false
  kafka:
    topic: ${KAFKA_TOPIC_LINK_UPDATES}
    dlqTopic: ${KAFKA_TOPIC_LINK_UPDATES}_dlq
    retry:
      max-attempts: 3
      backoff-interval-ms: 1000
logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m %clr(%kvp){yellow}%n%wEx"
